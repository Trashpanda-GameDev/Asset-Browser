# Publishes a release of the Windows app when a version tag is pushed:
#
#   1. Set `version` in Cargo.toml (say to 0.2.0), and commit and push it.
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# Velopack packs the build into a setup program, a portable zip, and the update package that the
# copies already out there download (src/updates.rs). Run by hand (Actions > Release > Run
# workflow), it builds and packs without publishing, and keeps the files as the run's artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One at a time: each release is packed against the one before it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Installed copies find their updates by this id and live in %LocalAppData%\<id>, so it can never
  # change. Not "AssetBrowser": that folder holds the app's cache, which uninstalling would delete.
  PACK_ID: TrashpandaAssetBrowser
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, for the release notes.
          fetch-depth: 0

      - name: Version
        id: version
        shell: bash
        run: |
          # Windows checkouts have CRLF line endings.
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml, $version."
            exit 1
          fi
          # The packer has to be the version of the velopack crate the app is built with.
          vpk=$(tr -d '\r' < Cargo.lock | sed -n '/^name = "velopack"$/{n;s/^version = "\(.*\)"$/\1/p}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vpk=$vpk" >> "$GITHUB_OUTPUT"
          echo "Asset Browser $version, packed with vpk $vpk"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install --global vpk --version ${{ steps.version.outputs.vpk }}
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Release notes
        shell: bash
        run: |
          # The commits since the release before.
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          git log --no-merges --format='- %s' "${previous:+$previous..}HEAD" > target/release-notes.md
          cat target/release-notes.md

      - name: Pack
        shell: bash
        run: |
          mkdir -p target/publish
          cp target/release/asset_browser.exe target/publish/
          # The latest release, so this one comes with a delta update from it.
          vpk download github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" -o target/velopack
          vpk pack --packId "$PACK_ID" --packVersion "${{ steps.version.outputs.version }}" \
            --packDir target/publish --mainExe asset_browser.exe --runtime win-x64 \
            --packTitle "Asset Browser" --packAuthors "Trashpanda GameDev" --icon assets/icon.ico \
            --releaseNotes target/release-notes.md -o target/velopack

      - name: Publish
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          vpk upload github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" -o target/velopack \
            --publish --tag "$GITHUB_REF_NAME" --releaseName "Asset Browser ${{ steps.version.outputs.version }}"

      - name: Keep the files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: asset-browser-${{ steps.version.outputs.version }}
          path: target/velopack
