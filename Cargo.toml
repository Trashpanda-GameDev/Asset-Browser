[package]
name = "asset_browser"
version = "0.1.0"
edition = "2024"
description = "A fast, native browser for folders of game assets: images, sounds, models and materials."
publish = false

[dependencies]
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "tiff", "webp", "ico", "qoi"] }
fast_image_resize = "6"
rayon = "1.12"
crossbeam-channel = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
rfd = "0.17"
directories = "6"

[profile.dev.package."*"]
# Decoders and resizers are unusably slow unoptimised; keep our own crate fast to rebuild.
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
